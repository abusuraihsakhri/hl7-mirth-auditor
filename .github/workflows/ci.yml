name: Test and package

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[server,test]' build
          python -m pip check
      - name: Compile Python
        run: python -m compileall -q agents hl7_auditor cli.py enrichment.py simulator.py
      - name: Run tests
        run: python -m pytest -v
      - name: Build wheel
        run: python -m build --wheel
      - name: Check browser JavaScript syntax
        run: node --check web/app.js
      - name: CLI smoke test
        run: |
          python -m hl7_auditor.cli audit -i sample_lab_stream.hl7
          python -m hl7_auditor.cli sanitize -i sample_lab_stream.hl7 -o /tmp/masked.hl7
          python cli.py verify-audit
