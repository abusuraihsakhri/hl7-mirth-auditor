name: Publish browser HL7 auditor

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          mkdir -p _site/hl7_auditor
          cp web/index.html web/app.js _site/
          cp hl7_auditor/{__init__,models,parser,auditor,sanitizer}.py _site/hl7_auditor/
          touch _site/.nojekyll
          node --check _site/app.js
          test -s _site/hl7_auditor/parser.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
